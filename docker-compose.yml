
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineops-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - SCHEDULER_ENABLED=false # Run API only by default in compose
    volumes:
      - cineops_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cineops_data:
    name: cineops_data
