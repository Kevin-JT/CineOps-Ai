name: Daily Recommendation

on:
  schedule:
    # 07:00 IST / 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: "daily-recommendation"
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily recommendation workflow
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/run_daily.py

      - name: Commit and push history
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/storage.json
          
          if git diff --cached --quiet; then
              echo "No history changes to commit."
          else
              git commit -m "chore: update recommendation history [skip ci]"
              git push
          fi

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7
