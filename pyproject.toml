[project]
name = "cineops-ai"
version = "0.1.0"
description = "AI-driven cinematic operations and automation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0.0", "pydantic-settings>=2.0.0", "httpx>=0.27.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.3.0", "black>=24.0.0", "mypy>=1.9.0", "pre-commit>=3.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
